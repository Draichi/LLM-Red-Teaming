[project]
name = "multiturn-attacker"
version = "0.1.0"
description = "Automated multi-turn jailbreak search, benchmarked against a human red teamer at equal budget."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
judge  = ["litellm>=1.100", "scikit-learn>=1.4", "pandas>=2.2"]
local  = ["mlx-lm>=0.14"]
api    = ["litellm>=1.100"]
report = ["matplotlib>=3.8", "pandas>=2.2"]
dev    = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
mta = "mta.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mta"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
