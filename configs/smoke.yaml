# Cheap live smoke of the Phase 1 path: 30 items, Featherless judge, thinking off.
# `uv run mta calibrate --config configs/smoke.yaml`
seed: 0
reports_dir: reports

judge:
  model: featherless_ai/Qwen/Qwen3-235B-A22B
  temperature: 0.0
  max_tokens: 1024
  # Qwen3-235B costs 4 concurrency units/request; feather_pro_plus limit is 4
  # units => 1 request at a time. Keep concurrency * unit_cost <= plan limit.
  max_concurrency: 1
  max_retries: 3
  disable_thinking: true
  json_mode: auto
  success_threshold: 0.5

calibration:
  dataset: harmbench_val
  path: data/calibration/harmbench_val.json
  sample_size: 30
  min_kappa: 0.7
  max_false_positive_rate: 0.1
